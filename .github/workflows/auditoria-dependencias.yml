name: Auditoría de dependencias

# Busca vulnerabilidades conocidas (pip-audit / OSV) en las versiones exactas del CI y en lo que
# resolvería hoy requirements.txt (lo que instalaría la VM). Si encuentra algo, el workflow falla
# y GitHub avisa por mail. No abre PRs ni ramas.
on:
  schedule:
    - cron: '0 7 * * 1'   # lunes 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - name: Versiones exactas del CI
        run: pip-audit -r constraints-ci.txt --no-deps --disable-pip
      - name: Lo que resolvería requirements.txt hoy
        run: pip-audit -r requirements.txt
